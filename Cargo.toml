[package]
name = "streamchat"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Unifica el chat y los eventos de Twitch y Kick y los expone vía gRPC"

[dependencies]
# Runtime async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures-util = "0.3"

# gRPC
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP (webhooks de Kick) y clientes REST / WebSocket
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Serialización y configuración
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

# Utilidades
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"

# Verificación de firmas de Kick
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"

[dev-dependencies]
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
